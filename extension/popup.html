<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreatTriage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a14;
      --surface:  #111122;
      --border:   #1e1e35;
      --brand:    #f97316;
      --brand-dim:#7c3210;
      --text:     #e5e7eb;
      --muted:    #6b7280;
      --safe:     #22c55e;
      --warn:     #eab308;
      --danger:   #ef4444;
    }

    body {
      width: 400px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
    }

    /* ── Header ─────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header svg { flex-shrink: 0; }
    .header-title { font-weight: 600; font-size: 15px; }
    .header-title span { color: var(--brand); }
    .header-badge {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Body ───────────────────────────── */
    .body { padding: 14px 16px; }

    .auto-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #22c55e;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 6px;
      padding: 5px 10px;
      margin-bottom: 10px;
    }
    .auto-badge svg { flex-shrink: 0; }

    textarea {
      width: 100%;
      height: 110px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--brand); }
    textarea::placeholder { color: var(--muted); }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-analyze {
      flex: 1;
      padding: 9px 0;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-analyze:hover { background: #ea580c; }
    .btn-analyze:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-clear {
      padding: 9px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-clear:hover { color: var(--text); border-color: #374151; }

    /* ── Scanning ───────────────────────── */
    .scanning {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(249,115,22,0.2);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scanning-text { font-size: 12px; color: var(--muted); }

    /* ── Results ────────────────────────── */
    .results {
      display: none;
      border-top: 1px solid var(--border);
    }

    /* Verdict row */
    .verdict-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
    }

    /* Gauge */
    .gauge-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: #1e1e35; stroke-width: 7; }
    .gauge-ring { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 163; stroke-dashoffset: 163; transition: stroke-dashoffset 1s ease-out, stroke 0.3s; }
    .gauge-label {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .gauge-num { font-size: 18px; font-weight: 700; line-height: 1; }
    .gauge-sub { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }

    /* Verdict info */
    .verdict-info { flex: 1; min-width: 0; }
    .verdict-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
      margin-bottom: 6px;
    }
    .reasoning {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Indicators */
    .indicators { padding: 0 16px 12px; }
    .indicators-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .indicator-list { display: flex; flex-direction: column; gap: 4px; }
    .indicator {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid;
    }
    .indicator-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; }
    .indicator-type {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .indicator-detail { font-size: 11px; color: #9ca3af; margin-top: 1px; }

    /* Sender */
    .sender-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    .sender-domain { font-family: monospace; color: #9ca3af; }

    /* Error */
    .error-box {
      display: none;
      margin: 0 16px 12px;
      padding: 9px 12px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 7px;
      color: #fca5a5;
      font-size: 11px;
      line-height: 1.5;
    }

    /* Colors */
    .c-safe     { color: var(--safe); }
    .c-warn     { color: var(--warn); }
    .c-danger   { color: var(--danger); }
    .c-muted    { color: var(--muted); }

    .sev-critical { background: rgba(239,68,68,0.08);   border-color: rgba(239,68,68,0.2); }
    .sev-high     { background: rgba(249,115,22,0.08);  border-color: rgba(249,115,22,0.2); }
    .sev-medium   { background: rgba(234,179,8,0.08);   border-color: rgba(234,179,8,0.2); }
    .sev-low      { background: rgba(59,130,246,0.08);  border-color: rgba(59,130,246,0.2); }

    .footer {
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer a {
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--brand); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.8">
      <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
      <path d="M9 12l2 2 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="header-title">Threat<span>Triage</span></span>
    <div class="header-badge"><div class="dot"></div>Workers AI</div>
  </div>

  <!-- Input -->
  <div class="body">
    <div id="auto-badge" class="auto-badge" style="display:none">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Email auto-detected from page
    </div>
    <textarea id="email-input" placeholder="Paste email here, or open an email in Gmail / Outlook and the content will be extracted automatically…"></textarea>
    <div class="actions">
      <button class="btn-analyze" id="analyze-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Analyze
      </button>
      <button class="btn-clear" id="clear-btn">Clear</button>
    </div>
  </div>

  <!-- Scanning -->
  <div class="scanning" id="scanning">
    <div class="spinner"></div>
    <span class="scanning-text">Analyzing with Workers AI…</span>
  </div>

  <!-- Error -->
  <div class="error-box" id="error-box"></div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="verdict-row">
      <div class="gauge-wrap">
        <svg viewBox="0 0 52 52">
          <circle class="gauge-bg" cx="26" cy="26" r="26"/>
          <circle id="gauge-ring" class="gauge-ring" cx="26" cy="26" r="26"/>
        </svg>
        <div class="gauge-label">
          <span id="gauge-num" class="gauge-num">0</span>
          <span class="gauge-sub">score</span>
        </div>
      </div>
      <div class="verdict-info">
        <div id="verdict-badge" class="verdict-badge"></div>
        <div id="reasoning" class="reasoning"></div>
      </div>
    </div>

    <div class="indicators" id="indicators-wrap" style="display:none">
      <div class="indicators-label">Threat Indicators</div>
      <div class="indicator-list" id="indicator-list"></div>
    </div>

    <div class="sender-row" id="sender-row" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Sender: <span id="sender-domain" class="sender-domain"></span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="https://threat-triage.suryanshsinghrawat.workers.dev" target="_blank">Open full app ↗</a>
    <a href="https://github.com/xsuryanshx/cf-threat-triage" target="_blank">GitHub ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
